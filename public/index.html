<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>松本さんのプライベート充実ツール</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .landing-hero {
      background: linear-gradient(135deg, #fff5f1 0%, #f0f4ff 100%);
      padding: 70px 20px 50px;
      text-align: center;
    }
    .landing-hero .badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary), #ff9a5c);
      color: white;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 16px;
      border-radius: 999px;
      margin-bottom: 18px;
      letter-spacing: 0.5px;
    }
    .landing-hero h1 {
      font-size: clamp(1.6rem, 5vw, 2.5rem);
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 14px;
    }
    .landing-hero h1 em {
      font-style: normal;
      background: linear-gradient(135deg, var(--primary), #ff9a5c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .landing-hero p {
      color: var(--gray);
      font-size: 0.95rem;
      max-width: 440px;
      margin: 0 auto;
    }
    .cards-section {
      padding: 50px 20px 70px;
      max-width: 820px;
      margin: 0 auto;
    }
    .cards-section h2 {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--gray);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .footer {
      text-align: center;
      padding: 30px 20px;
      color: var(--gray);
      font-size: 0.8rem;
      border-top: 1px solid var(--light-gray);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <span class="logo-icon">✨</span>
      <span>松本さんのツール</span>
    </a>
    <div class="navbar-links">
      <a href="idea.html">💡 アイデア</a>
      <a href="study.html">📚 勉強</a>
    </div>
  </nav>

  <!-- Hero -->
  <div class="landing-hero">
    <div class="badge">🎉 松本さん専用</div>
    <h1>プライベートを<br><em>もっと充実させよう</em></h1>
    <p>今日の気分や状況に合ったアイデア提案と、共通テスト対策ができる、あなただけのツールです。</p>
  </div>

  <!-- Feature Cards -->
  <div class="cards-section">
    <h2>2つの機能</h2>
    <div class="cards-grid">
      <a href="idea.html" class="feature-card orange">
        <div class="card-icon">💡</div>
        <div class="card-title">プライベート充実<br>アイデア提案</div>
        <div class="card-desc">
          今日の気分・時間・一緒にいる人などの質問に答えるだけで、あなたにピッタリのアイデアをAIが5〜10個提案します。
        </div>
        <div class="card-cta">
          今すぐ試す →
        </div>
      </a>

      <a href="study.html" class="feature-card blue">
        <div class="card-icon">📚</div>
        <div class="card-title">共通テスト<br>対策学習</div>
        <div class="card-desc">
          講義で重要事項をインプット、一問一答でしっかり定着。日本史からスタートして、全教科を攻略しましょう。
        </div>
        <div class="card-cta" style="color: var(--study);">
          勉強を始める →
        </div>
      </a>
    </div>
  </div>

  <div class="footer">
    © 2025 松本さんのプライベート充実ツール
  </div>

</body>
</html>
